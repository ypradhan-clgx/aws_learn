spring.application.name=aws-metadata
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${S3_BUCKET:cmtr-t3o1kj45-s3-1778950337}
aws.sqs.queue-url=${SQS_QUEUE_URL:}
aws.sqs.queue-name=${SQS_QUEUE_NAME:cmtr-t3o1kj45-UploadsNotificationQueue}
aws.sns.topic-arn=${SNS_TOPIC_ARN:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
